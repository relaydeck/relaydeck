name: PR Gate

# Auto-close PRs from contributors not approved with `lgtm`. Collaborators are
# always exempt. Uses pull_request_target so it can comment/close on PRs from
# forks WITHOUT checking out untrusted code (it only calls the API).
#
# Adapted, with thanks, from the pi project (earendil-works/pi) — see
# CONTRIBUTING.md. relaydeck's variant always exempts collaborators and has no
# weekend rule.

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-contributor:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR author
        uses: actions/github-script@v7
        with:
          script: |
            const APPROVED_FILE = '.github/APPROVED_CONTRIBUTORS';
            const VALID_CAPABILITIES = new Set(['issue', 'pr']);
            const prAuthor = context.payload.pull_request.user.login;
            const defaultBranch = context.payload.repository.default_branch;

            if (prAuthor.endsWith('[bot]')) {
              console.log(`Skipping bot: ${prAuthor}`);
              return;
            }

            async function getPermission(username) {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username,
                });
                return data.permission;
              } catch {
                return null;
              }
            }

            async function getTextFile(path) {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: defaultBranch,
              });
              if (!('content' in data) || typeof data.content !== 'string') {
                throw new Error(`Expected file content for ${path}`);
              }
              return Buffer.from(data.content, 'base64').toString('utf8');
            }

            function parseApprovedUsers(content) {
              const users = new Map();
              for (const rawLine of content.split('\n')) {
                const line = rawLine.trim();
                if (!line || line.startsWith('#')) continue;
                const parts = line.split(/\s+/);
                if (parts.length !== 2) continue;
                const [username, capability] = parts;
                const cap = capability.toLowerCase();
                if (!VALID_CAPABILITIES.has(cap)) continue;
                users.set(username.toLowerCase(), cap);
              }
              return users;
            }

            const permission = await getPermission(prAuthor);
            if (['admin', 'maintain', 'write'].includes(permission)) {
              console.log(`${prAuthor} is a collaborator (${permission}) — exempt`);
              return;
            }

            const approved = parseApprovedUsers(await getTextFile(APPROVED_FILE));
            if (approved.get(prAuthor.toLowerCase()) === 'pr') {
              console.log(`${prAuthor} is approved for PRs`);
              return;
            }

            const cm = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${defaultBranch}/CONTRIBUTING.md`;
            const message = [
              'This PR was auto-closed. Only contributors approved with `lgtm` on an issue can open PRs — please open a proposal issue first.',
              '',
              `See [CONTRIBUTING.md](${cm}). If a maintainer replies \`lgtm\` on one of your issues, your future PRs stay open.`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: message,
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: 'closed',
            });
