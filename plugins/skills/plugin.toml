[plugin]
name = "skills"
version = "0.1.0"
description = "Skill inventory + management: list, import, and materialize agent skills across workspaces and harnesses; read-only view of codex skills."
author = "relaydeck"
license = "MIT"
category = "infrastructure"
host_api_version = 1
# Daemon-wide: the skills layer observes + materializes across ALL
# workspaces, so it is not a per-workspace opt-in (don't put "skills"
# in a workspace agent.toml — that's the unrelated user-skills harness
# gate). This plugin is the generic consumer of `[plugin.skills]`.
workspace_scoped = false

# Capabilities the plugin exercises:
#   events.subscribe — workspace + plugin lifecycle drive re-sync
#   events.emit      — skills.changed / skills.invalid / skills.removed
#   workers.spawn    — the periodic inventory rescan worker
#   cli.register     — `relaydeck skills ...`
#   api.register     — `/api/plugins/skills/...`
declared_capabilities = [
  "events.subscribe",
  "events.emit",
  "workers.spawn",
  "cli.register",
  "api.register",
]

[plugin.settings]
scan_interval_seconds = { type = "number", default = 300.0, description = "Seconds between background skill inventory rescans (cache refresh + change events)." }
managed_import_check_interval_seconds = { type = "number", default = 3600.0, description = "Minimum seconds between upstream checks for Relaydeck-managed Git skill imports. Checks mark update state; they do not auto-apply updates." }
include_codex = { type = "boolean", default = true, description = "Include ~/.codex/skills (+ .system) in the read-only inventory." }
include_claude = { type = "boolean", default = true, description = "Include Claude Code skills (~/.claude/skills + per-workspace .claude/skills) in the read-only inventory." }
inject_plugin_authoring_skill = { type = "boolean", default = true, description = "Materialize both bundled skills (relaydeck-fleet orientation + relaydeck-plugin-dev) into every workspace. Off → agents lose the fleet quick-reference and the plugin-authoring how-to." }

# These two ship in the consolidated top-level `skills/` folder (the single,
# shareable home for first-party skills) rather than inside this plugin dir.
# Paths resolve relative to this plugin dir (`plugin_dir / rel`), and the
# `skills/relaydeck-*` trees are force-included in the wheel (see pyproject),
# so the same relative path resolves in both the source tree and an install.
[plugin.skills]
relaydeck-fleet = "../../skills/relaydeck-fleet/SKILL.md"
relaydeck-plugin-dev = "../../skills/relaydeck-plugin-dev/SKILL.md"

[plugin.ui]
# First-class rail lens when loaded — operators get a top-level view of
# every skill, its source/health, and which agents will see it.
tabs = [
  { id = "skills", title = "Skills", icon = "bolt", module = "panel.js", order = 30, default_state = "lens" }
]
