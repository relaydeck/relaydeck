[plugin]
name = "manager"
version = "0.1.0"
description = "A fleet-health policy layer: subscribes to context-pressure (agent.context), usage caps (usage_limits.exceeded) and failed messages (agent.message_failed) and turns them into AUDITABLE actions — recommend by default, or execute (fresh session / pause) when you opt in. Every decision emits `manager.action`. Composes with autopilot, hitl, usage-limits — it decides what to DO once they've surfaced a condition."
author = "relaydeck"
license = "MIT"
category = "infrastructure"
host_api_version = 1
workspace_scoped = false

# Capabilities:
#   events.subscribe — agent.context / usage_limits.exceeded / agent.message_failed
#   events.emit      — manager.action (audit trail)
#   cli.register     — `relaydeck manager status`
#   api.register     — `/api/plugins/manager/{actions,policy,tui}`
#   agents.list      — resolve workspace for the action payload
#   agents.stop      — execute a `pause` action
# Session reset (`fresh-session`) reuses the in-process orchestrator, like hitl.
declared_capabilities = [
  "events.subscribe",
  "events.emit",
  "cli.register",
  "api.register",
  "agents.list",
  "agents.stop",
]

[plugin.tui]
tabs = [
  { id = "manager", title = "Manager", endpoint = "tui", order = 70 }
]

[plugin.settings]
on_context_critical = { type = "enum", default = "recommend", options = ["off", "recommend", "fresh-session", "pause"], description = "What to do when an agent crosses critical context fill (agent.context). recommend = emit advice only (default, safe). fresh-session = reset the agent to a clean session. pause = stop the agent for a human." }
on_usage_exceeded = { type = "enum", default = "recommend", options = ["off", "recommend", "pause"], description = "What to do when an agent exceeds a usage window (usage_limits.exceeded). recommend = advice only. pause = stop the agent. (usage-limits can also pause directly; leave this on recommend to avoid double-acting.)" }
